# MATRIX design system: "Soft Plum & Ivory" (see ui/theme.py for the full palette)
[theme]
base = "light"
primaryColor = "#8C4A6B"              # plum (white text 6.4:1)
backgroundColor = "#F8F5F7"           # pale ivory
secondaryBackgroundColor = "#F1EAF0"  # soft card tint
textColor = "#3A1628"                 # dark burgundy
borderColor = "#E7DAE3"
linkColor = "#8C4A6B"
baseRadius = "1rem"
buttonRadius = "999px"
showWidgetBorder = true
# Google Fonts; both fall back to the system font when offline
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
dataframeHeaderBackgroundColor = "#F6F0F4"
dataframeBorderColor = "#E7DAE3"
redColor = "#C2453C"
greenColor = "#3E8159"
orangeColor = "#C08A2E"
yellowColor = "#C08A2E"
chartCategoricalColors = ["#8C4A6B", "#9A8692", "#C9A9BD", "#3E8159", "#C08A2E"]

[theme.sidebar]
backgroundColor = "#F1EAF0"

[server]
headless = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
